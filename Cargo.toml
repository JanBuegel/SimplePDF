[package]
name = "simplepdf"
version = "0.1.5"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = { version = "0.37", features = ["winit", "wayland", "x11"] }
egui-winit = { version = "0.37", default-features = false, features = ["wayland", "x11", "clipboard"] }
log = "0.4.34"
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_latest", "thread_safe"] }
pollster = "1.0.1"
rosc = "0.11"
velopack = "1.2.161"
winit = "0.30"

[profile.release]
lto = "thin"
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Foundation"] }
